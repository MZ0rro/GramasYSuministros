<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gramas y Suministros - Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="https://brandemia.org/contenido/subidas/2023/01/logo-coca-cola-2003-2020-1024x576.png" alt="Logo">
            <h1>Gramas <span>Y Suministros</span></h1>
        </div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Tickets</a>
        </nav>
        <div class="icono-usuario">👤</div>
    </header>

    <main>
        <section class="formulario">
            <h2>Usuario</h2>

            <form>
                <label for="correo">Dirección de correo 
                    <span class="rojo">(Solo se permite correo electrónico)</span>
                </label>
                <div class="input-con-icono">
                    <img src="https://cdn-icons-png.flaticon.com/512/1944/1944250.png" alt="icono correo">
                    <input type="email" id="correo" placeholder="">
                </div>

                <label for="contrasena">Contraseña 
                    <span class="rojo">(Debe contener letras y números)</span>
                </label>
                <div class="input-con-icono">
                    <img src="https://icons.veryicon.com/png/o/miscellaneous/remitting-country-linear-icon/password-148.png" alt="icono candado">
                    <input type="password" id="contrasena" placeholder="">
                </div>

                <div class="opciones">
                    <a href="#" class="olvido">He olvidado mi contraseña.</a>
                    <p>¿No tiene una cuenta? <a href="#" class="registro">¡Regístrese!</a></p>
                </div>

                <div class="botones">
                    <button type="button" class="volver">Volver</button>
                    <button type="submit" class="iniciar">Iniciar sesión</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Gramas y Suministros - 2025. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
